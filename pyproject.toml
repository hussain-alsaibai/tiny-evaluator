[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-evaluator"
version = "0.1.0"
description = "Zero-dependency LLM evaluation harness for AI agents and tool-using systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com"},
]
keywords = ["ai", "llm", "evaluation", "agents", "testing", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-evaluator"
Repository = "https://github.com/hussain-alsaibai/tiny-evaluator"
Issues = "https://github.com/hussain-alsaibai/tiny-evaluator/issues"

[tool.setuptools]
py-modules = ["tiny_evaluator"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]